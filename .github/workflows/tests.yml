name: tests

# CI do revcalc. Antes não havia workflow → a suíte podia apodrecer em silêncio
# (foi o que aconteceu nas migrações v0.6.0/v0.6.9). Roda em todo PR e no push p/ main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest (engine + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        # [web] traz fastapi/cryptography/itsdangerous; as deps do engine vêm de
        # [project].dependencies. pytest/pytest-mock são o runner (pyinstaller fica
        # de fora — não é preciso p/ testar). conftest.py injeta src/ no path.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]" pytest pytest-mock

      - name: Run tests
        run: pytest

  web-build:
    name: next build (front)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build (type-check + compile)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
