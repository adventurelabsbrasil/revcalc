[project]
name = "calculadora-crefaz"
version = "0.9.3"
description = "Calculadora de Ação Crefaz — Rose Portal Advocacia (MVP)"
requires-python = ">=3.11"
authors = [
    {name = "Adventure Labs", email = "contato@adventurelabs.com.br"},
]
dependencies = [
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.2",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "keyring>=24.3.0",
    "python-dateutil>=2.9.0",
    "Unidecode>=1.3.8",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.5.0",
]
# Backend web (server/). google-auth-oauthlib já está em [project].dependencies.
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    "itsdangerous>=2.1.0",
]

[project.scripts]
calculadora-crefaz = "calculadora_crefaz.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calculadora_crefaz = ["../../templates/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
